name: Symbol Library Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Library
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Run Symbol Library Linter
        run: |
          find Symbols -name "*.kicad_sym" -exec python3 scripts/linter_validator.py {} +

      - name: Verify Symbol Compiler Output
        run: |
          python3 scripts/build_symbol_libs.py
          git diff --exit-code Symbols/*.kicad_sym

      - name: Run End-to-End Component Flow & Verification Suite
        run: |
          python3 scripts/test_e2e_flow.py --test-addition --verify-all


