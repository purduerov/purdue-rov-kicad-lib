name: Cross-Platform Library CI Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-matrix:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # A hung leg must fail in minutes. Without this the macOS legs ran for six
    # hours before anyone cancelled them, which hid the real problem and burned
    # runner time. The suite takes well under a minute where it can run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Library
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Test Dependencies
        # Only the test-time YAML parser. The library scripts and the CLI keep
        # running on the standard library alone.
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Unit and GUI Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Run Unit and GUI Tests (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          # Tk needs a usable display. Linux gets xvfb above and Windows has a
          # desktop session, but the macOS runner has no WindowServer session
          # for Tk, where root creation blocks instead of failing. The GUI
          # classes skip themselves before touching Tk, so this leg still runs
          # every non-GUI test. GUI coverage comes from the Linux and Windows
          # legs.
          ROV_SKIP_GUI_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          python -m unittest discover -s tests -v

  lint-symbols:
    # The library's metadata gate, and the check this branch protection requires.
    # It used to run as a step inside all twelve matrix legs, which both wasted
    # twelve runs and left the required check name unsatisfiable. One dedicated
    # job makes the required check real and runs the gate once.
    name: lint-symbols
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Library
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Symbol Library Linter
        run: |
          python scripts/linter_validator.py Symbols

      - name: Verify Symbol Compiler Output
        run: |
          python scripts/build_symbol_libs.py
          git diff --exit-code Symbols/*.kicad_sym

  codepage-resilience:
    name: Codepage Resilience (Windows, Py 3.13, ASCII/cp1252)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Library
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Codepage and Console Safety Tests under ASCII encoding
        env:
          PYTHONIOENCODING: ascii
          PYTHONUTF8: "0"
        run: |
          python -m unittest tests/test_codepage_safety.py -v
          python -m unittest tests/test_emoji_purge.py -v
