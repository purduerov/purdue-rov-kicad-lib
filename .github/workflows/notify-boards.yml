name: Notify Board Repositories

on:
  # Boards are notified only after the approved library revision has passed the
  # full cross-platform library CI run, so a failed validation never fans out
  # update requests. workflow_dispatch stays available for a manual retry.
  workflow_run:
    workflows: ["Cross-Platform Library CI Matrix"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# A GITHUB_TOKEN cannot dispatch an event into another repository, so this job
# holds no workflow-token permissions at all. It depends on ORG_DISPATCH_TOKEN or
# PAT_TOKEN, and the warning below says so when neither is configured.
permissions: {}

jobs:
  dispatch-update:
    # A manual dispatch always runs. An automatic run needs a green library CI
    # for a push: a re-run of an old pull_request workflow_run is not an
    # approved library revision.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - board-template
          - X19-Control-Board
          - X19-Electrical-New-Member-Board
          - X19-Float-Board
          - X19-Pi-Shield-Board
          - X19-Power-Slab-Board
          - X19-Pressure-Chamber-Board
          - X19-USB-Hub-Board
    steps:
      - name: Warn About Token Fallback
        # Without an org or personal token the dispatch below can only use the
        # GITHUB_TOKEN, which cannot reach another repository. Say so instead of
        # letting every board look silently skipped.
        if: ${{ env.ORG_DISPATCH_TOKEN == '' && env.PAT_TOKEN == '' }}
        env:
          ORG_DISPATCH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "::warning::Neither ORG_DISPATCH_TOKEN nor PAT_TOKEN is configured. The GITHUB_TOKEN fallback cannot dispatch to another repository, so the board repositories will not be notified."

      - name: Dispatch Library Update Event
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.ORG_DISPATCH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          repository: purduerov/${{ matrix.repo }}
          event-type: update-library
