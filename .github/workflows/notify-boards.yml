name: Notify Board Repositories

on:
  push:
    branches:
      - master

jobs:
  dispatch-update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - board-template
          - X19-Electrical-New-Member-Board
          - X19-Float-Board
    steps:
      - name: Dispatch Library Update Event
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.ORG_DISPATCH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          repository: purduerov/${{{ matrix.repo }}}
          event-type: update-library
