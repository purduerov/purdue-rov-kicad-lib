name: Notify Board Repositories

on:
  # Boards are notified only after the approved library revision has passed the
  # full cross-platform library CI run, so a failed validation never fans out
  # update requests. workflow_dispatch stays available for a manual retry.
  workflow_run:
    workflows: ["Cross-Platform Library CI Matrix"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# The dispatch uses this repository's built-in GITHUB_TOKEN, so no token secret
# has to be created or rotated to keep the boards notified. That was verified
# rather than assumed: a run with no extra secret configured reached all eight
# board repositories. If a future organisation policy blocks that, a token can
# be added back to the dispatch step alone.
permissions: {}

jobs:
  dispatch-update:
    # A manual dispatch always runs. An automatic run needs a green library CI
    # for a push: a re-run of an old pull_request workflow_run is not an
    # approved library revision.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - board-template
          - X19-Control-Board
          - X19-Electrical-New-Member-Board
          - X19-Float-Board
          - X19-Pi-Shield-Board
          - X19-Power-Slab-Board
          - X19-Pressure-Chamber-Board
          - X19-USB-Hub-Board
    steps:
      - name: Dispatch Library Update Event
        id: dispatch
        uses: peter-evans/repository-dispatch@v3
        # One unreachable board must not hide the state of the other seven, so
        # the fan-out continues. The step below turns a real dispatch failure
        # into a failed job, so a green run still means every board was notified.
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: purduerov/${{ matrix.repo }}
          event-type: update-library

      - name: Report Dispatch Result
        env:
          REPO: purduerov/${{ matrix.repo }}
        run: |
          set -uo pipefail
          if [ "${{ steps.dispatch.outcome }}" = "failure" ]; then
            echo "::error::The update-library dispatch to $REPO failed. That board was not notified, so its scheduled library update did not run."
            echo "- $REPO: dispatch **failed**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Dispatch to $REPO accepted."
          echo "- $REPO: dispatch accepted" >> "$GITHUB_STEP_SUMMARY"
